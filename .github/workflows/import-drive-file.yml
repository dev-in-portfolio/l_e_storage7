name: Import one chunked Library file

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.transfer/import-*.json'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      TRANSFER_BRANCH: ${{ github.event.pull_request.head.ref }}
      REPO: ${{ github.repository }}
      TOKEN: ${{ github.token }}
    steps:
      - name: Reconstruct, verify, LFS-commit exactly one file
        shell: bash
        run: |
          set -euo pipefail

          git init .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          git fetch --depth=1 origin "${TRANSFER_BRANCH}"
          git checkout -B "${TRANSFER_BRANCH}" FETCH_HEAD

          manifest="$(find .transfer -maxdepth 1 -type f -name 'import-*.json' -print -quit)"
          [ -n "$manifest" ] || { echo "No import manifest found"; exit 0; }

          python3 - "$manifest" <<'PY'
          import base64, hashlib, json, pathlib, sys
          mpath = pathlib.Path(sys.argv[1])
          meta = json.loads(mpath.read_text())
          out = pathlib.Path(meta['path'])
          out.parent.mkdir(parents=True, exist_ok=True)
          with out.open('wb') as dst:
              for rel in meta['chunks']:
                  text = pathlib.Path(rel).read_text().strip()
                  dst.write(base64.b64decode(text, validate=True))
          size = out.stat().st_size
          sha = hashlib.sha256(out.read_bytes()).hexdigest()
          print(f"reconstructed {size} bytes sha256={sha}")
          if size != meta['size']:
              raise SystemExit(f"size mismatch: got {size}, expected {meta['size']}")
          if sha != meta['sha256']:
              raise SystemExit(f"sha mismatch: got {sha}, expected {meta['sha256']}")
          PY

          path="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["path"])' "$manifest")"
          mapfile -t chunks < <(python3 -c 'import json,sys; [print(x) for x in json.load(open(sys.argv[1]))["chunks"]]' "$manifest")

          git lfs install --local
          git add -- "$path"
          git rm -- "$manifest" "${chunks[@]}"
          git rm -f -- .transfer/drive-paws-up.json 2>/dev/null || true
          git commit -m "Import $path"
          git push origin HEAD:"${TRANSFER_BRANCH}"
